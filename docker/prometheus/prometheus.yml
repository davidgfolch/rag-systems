# Prometheus scrape configuration for RAG Systems
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'rag-apps'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'host.docker.internal:8080'   # rag-basic
          - 'host.docker.internal:8081'   # rag-advanced
          - 'host.docker.internal:8082'   # rag-agentic
