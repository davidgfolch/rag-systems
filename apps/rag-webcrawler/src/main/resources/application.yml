spring:
  application:
    name: rag-webcrawler
  threads:
    virtual:
      enabled: true
  profiles:
    active: local,observability

server:
  port: ${RAG_WEBCRAWLER_PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

rag:
  crawler:
    prioritizer: ${CRAWLER_PRIORITIZER:deterministic}
    discovery:
      max-urls: ${CRAWLER_MAX_URLS:2000}
      timeout-seconds: ${CRAWLER_DISCOVERY_TIMEOUT_SECONDS:20}
