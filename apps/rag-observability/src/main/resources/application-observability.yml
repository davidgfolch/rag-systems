# Observed apps default config
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

logging:
  file:
    path: ${LOG_DIR:./logs}
  level:
    root: INFO
    com.rag: DEBUG
    org.springframework.ai: DEBUG
    org.springframework.web: WARN
    org.hibernate.SQL: WARN