# rag-basic default configuration (providers consumed via the rag-provider service)
spring:
  profiles:
    active: local,observability
  application:
    name: rag-basic
  datasource:
    url: jdbc:postgresql://${PGVECTOR_HOST:localhost}:${PGVECTOR_PORT:5432}/${PGVECTOR_DB:rag}
    username: ${PGVECTOR_USER:rag}
    password: ${PGVECTOR_PASSWORD:rag}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  webcrawler:
    url: ${RAG_WEBCRAWLER_URL:http://localhost:8085}
  ai:
    vectorstore:
      pgvector:
        # blank -> schema is derived from the active embedding dimension (rag_<dim>)
        schema-name: ${PGVECTOR_SCHEMA:}
        table-name: chunks
        schema-validation: true
        initialize-schema: true

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

rag:
  provider:
    url: ${RAG_PROVIDER_URL:http://localhost:8086}
  vector-store:
    type: ${VECTOR_STORE_TYPE:pgvector}
  chunking:
    strategy: recursive
    size: ${CHUNK_SIZE:512}
    overlap: ${CHUNK_OVERLAP:128}