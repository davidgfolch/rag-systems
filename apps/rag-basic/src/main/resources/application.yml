# rag-basic default configuration (providers consumed via the rag-provider service)
spring:
  profiles:
    active: local,observability
  application:
    name: rag-basic
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${PGVECTOR_HOST:localhost}:${PGVECTOR_PORT:5432}/${PGVECTOR_DB:rag}
    username: ${PGVECTOR_USER:rag}
    password: ${PGVECTOR_PASSWORD:rag}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
      validation-timeout: ${HIKARI_VALIDATION_TIMEOUT:5000}
      keepalive-time: ${HIKARI_KEEPALIVE_TIME:60000}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  webcrawler:
    url: ${RAG_WEBCRAWLER_URL:http://localhost:8085}
  ai:
    vectorstore:
      pgvector:
        # PGVECTOR_BASIC_SCHEMA pins this module's schema (rag_basic by default);
        # never share it with another module or retrievals cross-contaminate
        schema-name: ${PGVECTOR_BASIC_SCHEMA:rag_basic}
        table-name: chunks
        schema-validation: true
        initialize-schema: true
        max-document-batch-size: ${PGVECTOR_MAX_BATCH_SIZE:500}

server:
  port: ${RAG_BASIC_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

rag:
  provider:
    url: ${RAG_PROVIDER_URL:http://localhost:8086}
  embedding:
    batch-size: ${RAG_EMBED_BATCH_SIZE:100}
  vector-store:
    type: ${VECTOR_STORE_TYPE:pgvector}
  chunking:
    strategy: recursive
    size: ${CHUNK_SIZE:512}
    overlap: ${CHUNK_OVERLAP:128}