spring:
  application:
    name: rag-provider

server:
  port: ${RAG_PROVIDER_PORT:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

rag:
  provider:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat-model: ${OLLAMA_CHAT_MODEL:phi4}
      embedding-model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
      discovery:
        enabled: ${OLLAMA_DISCOVERY_ENABLED:true}
        port: ${OLLAMA_DISCOVERY_PORT:11434}
        connect-timeout-ms: ${OLLAMA_DISCOVERY_CONNECT_TIMEOUT_MS:500}
        probe-timeout-ms: ${OLLAMA_DISCOVERY_PROBE_TIMEOUT_MS:3000}
        max-hosts: ${OLLAMA_DISCOVERY_MAX_HOSTS:1024}
        subnets: ${OLLAMA_DISCOVERY_SUBNETS:}
        cache-file: ${OLLAMA_DISCOVERY_CACHE:data/discovery/cache.json}
        positive-ttl-seconds: ${OLLAMA_DISCOVERY_CACHE_SECONDS:3600}
        negative-ttl-seconds: ${OLLAMA_DISCOVERY_NEGATIVE_CACHE_SECONDS:60}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:}
      chat-model: ${OPENAI_CHAT_MODEL:gpt-4o}
      embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    embedding:
      batch-size: ${RAG_PROVIDER_EMBED_BATCH_SIZE:100}
    defaults:
      chat-provider: ${DEFAULT_CHAT_PROVIDER:ollama}
      embedding-provider: ${DEFAULT_EMBEDDING_PROVIDER:ollama}
    catalog:
      url: ${MODEL_CATALOG_URL:https://models.dev/api.json}
      ttl: ${MODEL_CATALOG_TTL:86400}
      enabled: ${MODEL_CATALOG_ENABLED:true}