sonar.projectKey=rag-systems
sonar.projectName=RAG Systems
sonar.projectVersion=0.1.0-SNAPSHOT

sonar.exclusions=**/target/**

# Mirror the JaCoCo excludes in the parent POM: wiring/bootstrap code is not
# counted toward the coverage gate.
sonar.coverage.exclusions=**/config/**,**/*Application.*

sonar.scanner.skipJreProvisioning=true

sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=**/target/surefire-reports

sonar.host.url=http://localhost:9000
