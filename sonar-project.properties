sonar.projectKey=rag-systems
sonar.projectName=RAG Systems
sonar.projectVersion=0.1.0-SNAPSHOT

sonar.exclusions=**/target/**

# Mirror the JaCoCo excludes in the parent POM: wiring/bootstrap/generated code
# is not counted toward the coverage gate. Keep in sync with pom.xml.
sonar.coverage.exclusions=**/config/**,**/*Application.*,**/dto/**,**/generated-sources/**,**/rag-contract/**

# Each module intentionally mirrors the same pipeline tests (ingestion, chat
# handler, context wiring) over its own module-specific types, so CPD would
# only ever report that scaffold. Scope duplication detection to production code.
sonar.cpd.exclusions=**/src/test/**

sonar.scanner.skipJreProvisioning=true

sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=**/target/surefire-reports

sonar.host.url=http://localhost:9000
