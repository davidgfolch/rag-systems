name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'

jobs:
  build:
    name: Build modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build all modules (skip tests)
        run: ./mvnw clean package -DskipTests -B

  architecture-tests:
    name: Architecture tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run architecture tests
        run: ./mvnw test -Dtest=ArchitectureTest -Dsurefire.failIfNoSpecifiedTests=false -B

  tests:
    name: Tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - rag-common
          - rag-basic
          - rag-memory
          - rag-webcrawler
          - rag-advanced
          - rag-agentic
          - rag-evaluation
          - rag-observability
          - rag-cli
          - rag-tui
    steps:
      - uses: actions/checkout@v5

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Install dependencies
        run: ./mvnw clean install -DskipTests -B

      - name: Run tests with coverage
        run: ./mvnw -pl apps/${{ matrix.module }} -am verify -B

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.module }}
          path: apps/${{ matrix.module }}/target/site/jacoco/
          if-no-files-found: ignore

  coverage-badges:
    name: Coverage Badges
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-artifacts

      - name: Reconstruct per-module JaCoCo CSVs
        run: |
          for csv in coverage-artifacts/*/jacoco.csv; do
            module=$(basename $(dirname "$csv"))
            mkdir -p "apps/$module/target/site/jacoco"
            cp "$csv" "apps/$module/target/site/jacoco/jacoco.csv"
          done

      - name: Generate coverage badges
        run: bash scripts/coverage-badges.sh

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "chore: update coverage badges [skip ci]"
            git push
          else
            echo "No changes to coverage badges"
          fi
